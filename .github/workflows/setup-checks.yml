name: Setup checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
        node: ['24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fetch historical GSD migration fixtures
        run: git fetch --no-tags origin 31ee01f4fe6bcf75ff93cc56e6889a0cd9760009 f7a31811ca34e91ae04b4c29558323cce74ef156
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Read-only active IDE diagnostic fixtures (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/test-running-antigravity-diagnostic.ps1
      - name: Read-only active IDE diagnostic fixtures (PowerShell 7)
        shell: pwsh
        run: ./tests/test-running-antigravity-diagnostic.ps1
      - name: Installer, settings, rules, backup and guards
        shell: bash
        run: |
          set +e
          npm test > "$RUNNER_TEMP/workstation-tests.log" 2>&1
          test_status=$?
          cat "$RUNNER_TEMP/workstation-tests.log"
          if [ "$test_status" -ne 0 ]; then
            node -e 'const fs = require("node:fs"); for (const line of fs.readFileSync(process.argv[1], "utf8").split(/\r?\n/)) if (/not ok|error:|Error:|AssertionError|expected:|actual:|✖/.test(line)) console.log("::error::" + line.replace(/%/g, "%25").replace(/\r/g, "%0D"));' "$RUNNER_TEMP/workstation-tests.log"
          fi
          exit "$test_status"
      - name: Independent acceptance coverage and actual manual recording Git fixture
        run: npm run test:corrective-audit
      - name: Portable font staging checks
        run: npm run test:powershell
      - name: Production Git Panel VSIX contents and missing-media preflight
        shell: pwsh
        run: ./tests/test-git-panel-vsix.ps1
      - name: Windows PowerShell 5.1 Git Panel VSIX packaging
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\test-git-panel-vsix.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows PowerShell 5.1 bootstrap preview
        shell: powershell
        run: |
          & .\scripts\bootstrap.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows PowerShell 5.1 bootstrap modes, failures and source refresh
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\test-bootstrap.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows PowerShell 5.1 font registration and repeat
        shell: powershell
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'workstation-font-error.json'
          foreach ($run in 1, 2) {
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\install-font.ps1 -ManifestPath .\config\font.json -ErrorReportPath $report
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-checks-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/workstation-tests.log
          if-no-files-found: warn
          retention-days: 7
