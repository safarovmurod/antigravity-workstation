name: Setup checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '24' }
          - { os: windows-2022, node: '24' }
          - { os: windows-2022, node: '26' }
          - { os: windows-2025, node: '24' }
          - { os: windows-2025, node: '26' }
          - { os: windows-11-arm, node: '24' }
          - { os: windows-11-arm, node: '26' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - name: Installer, settings, rules, backup and guards
        shell: bash
        run: |
          set +e
          npm test > "$RUNNER_TEMP/workstation-tests.log" 2>&1
          test_status=$?
          cat "$RUNNER_TEMP/workstation-tests.log"
          if [ "$test_status" -ne 0 ]; then
            node -e 'const fs = require("node:fs"); const lines = fs.readFileSync(process.argv[1], "utf8").split(/\r?\n/); for (const line of lines) if (/not ok|error:|Error:|AssertionError|expected:|actual:|✖/.test(line)) console.log("::error::" + line.replace(/%/g, "%25").replace(/\r/g, "%0D"));' "$RUNNER_TEMP/workstation-tests.log"
            node -e 'const fs=require("node:fs");const text=fs.readFileSync(process.argv[1],"utf8").split(/\r?\n/).slice(-180).join("\n").slice(-16000);console.log("::error title=Full test failure tail::"+text.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A"));' "$RUNNER_TEMP/workstation-tests.log"
          fi
          exit "$test_status"
      - name: Independent acceptance coverage and actual manual recording Git fixture
        run: npm run test:corrective-audit
      - name: Portable font staging checks
        run: npm run test:powershell
      - name: Production Git Panel VSIX contents and missing-media preflight
        shell: pwsh
        run: ./tests/test-git-panel-vsix.ps1
      - name: Windows PowerShell 5.1 Git Panel VSIX packaging
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\test-git-panel-vsix.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bootstrap timeouts, retries, fallback and README launcher
        run: npm run test:bootstrap:network
      - name: Windows PowerShell 5.1 network helpers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\test-bootstrap-network.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows PowerShell 5.1 bootstrap preview
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\scripts\bootstrap.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows PowerShell 5.1 bootstrap success and failures
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\test-bootstrap.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real PowerShell HTTP retries, invalid responses and long download paths
        run: node tests/test-bootstrap-http.cjs
      - name: Windows PowerShell 5.1 font registration and repeat
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'workstation-font-error.json'
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\install-font.ps1 -ManifestPath .\config\font.json -ErrorReportPath $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\install-font.ps1 -ManifestPath .\config\font.json -ErrorReportPath $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual published main bootstrap, configuration update and offline cache reuse
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          WORKSTATION_EXPECTED_MAIN_SHA: ${{ github.sha }}
        run: ./tests/test-bootstrap-live.ps1 -Ref main -ExpectedCommit $env:WORKSTATION_EXPECTED_MAIN_SHA
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-checks-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/workstation-tests.log
          if-no-files-found: warn
          retention-days: 7
