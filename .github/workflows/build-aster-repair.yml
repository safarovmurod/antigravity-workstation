name: Verify Aster VSIX build
on:
  push:
    branches: [main]
    paths:
      - 'extensions/aster-appearance/**'
      - 'scripts/build-aster.cjs'
      - 'scripts/package-aster.cjs'
      - 'config/extensions.json'
      - 'tests/test-aster-appearance.mjs'
      - '.github/workflows/macos-setup.yml'
      - '.github/workflows/build-aster-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == 'safarovmurod/antigravity-workstation' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Deterministic themes, manifests, and SHA-256
        run: |
          node scripts/build-aster.cjs
          node scripts/package-aster.cjs
          git diff --check
      - name: Aster and personal configuration regression tests
        run: |
          node --test tests/test-aster-appearance.mjs tests/test-personal-config-preservation.mjs
      - name: Full regression tests with packaged assets
        run: npm test
      - name: Ensure no source changes outside expected build products
        run: |
          git status --short
          git diff --exit-code -- scripts/build-aster.cjs scripts/package-aster.cjs lib config tests README.md
      - uses: actions/upload-artifact@v4
        with:
          name: verified-aster-vsix
          path: extensions/aster-appearance/*.vsix
          if-no-files-found: error
