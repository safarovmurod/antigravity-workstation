name: Real IDE documentation screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/agent-automation.js'
      - 'lib/paths.js'
      - 'lib/extensions.js'
      - 'tests/docs-screenshots/**'
      - '.github/workflows/docs-screenshots.yml'
      - 'extensions/calm-typescript/**'
      - 'extensions/workstation-stability/**'
  pull_request:
    paths:
      - 'lib/agent-automation.js'
      - 'lib/paths.js'
      - 'lib/extensions.js'
      - 'tests/docs-screenshots/**'
      - '.github/workflows/docs-screenshots.yml'
      - 'extensions/calm-typescript/**'
      - 'extensions/workstation-stability/**'

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Build reproducible extension
        run: |
          npm run build:calm-typescript
          npm run build:stability
      - name: Capture actual official Antigravity IDE
        shell: pwsh
        run: ./tests/docs-screenshots/capture.ps1
      - name: Retain bounded redacted native crash evidence in the job log
        if: failure()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const {redact}=require('./extensions/workstation-stability/repair-chat.cjs');
          const root=path.join(process.env.RUNNER_TEMP,'workstation-docs-screenshots');
          if(fs.existsSync(root))for(const name of fs.readdirSync(root).filter(name=>/-ide\.log$/.test(name))){
            const file=path.join(root,name),stat=fs.lstatSync(file);if(!stat.isFile()||stat.isSymbolicLink())continue;
            console.log(name+'\n'+redact(fs.readFileSync(file,'utf8').slice(-12000),12000));
          }
          NODE
      - name: Upload unmodified screenshots and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workstation-docs-screenshots
          path: ${{ runner.temp }}/workstation-docs-screenshots
          if-no-files-found: error
          retention-days: 14
