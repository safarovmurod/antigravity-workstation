name: Real IDE documentation screenshots

on:
  workflow_dispatch:
    inputs:
      publish_media:
        description: Publish only all eight verified real IDE guides to a new media branch, never main
        type: boolean
        default: false
  push:
    branches: ['codex/**']
    paths:
      - 'tests/docs-screenshots/**'
      - '.github/workflows/docs-screenshots.yml'
      - 'extensions/calm-typescript/**'

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Build reproducible extension
        run: |
          npm run build:calm-typescript
          npm run build:stability
      - name: Nested Webview protocol regression (not live IDE proof)
        run: node --test tests/docs-screenshots/test-panel-locator.mjs
      - name: Install bounded media encoder
        run: python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
      - name: Capture actual official Antigravity IDE
        shell: pwsh
        run: ./tests/docs-screenshots/capture.ps1
      - name: Upload unmodified screenshots and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workstation-docs-screenshots
          path: ${{ runner.temp }}/workstation-docs-screenshots
          if-no-files-found: error
          retention-days: 14
  publish-verified-media:
    needs: screenshots
    if: github.event_name == 'workflow_dispatch' && inputs.publish_media && github.repository == 'safarovmurod/antigravity-workstation' && github.ref_name == 'codex/corrective-audit-20261025'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: workstation-docs-screenshots
          path: ${{ runner.temp }}/verified-live-media
      - name: Verify exact current source and media bytes
        env:
          WORKSTATION_MEDIA_ARTIFACT: ${{ runner.temp }}/verified-live-media
        run: node tests/docs-screenshots/publish-media.cjs
      - name: Save verified media on a new isolated branch
        env:
          MEDIA_BRANCH: media/real-guides-${{ github.run_id }}
        run: |
          git switch -c "$MEDIA_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/feature-guides/current-branch.gif docs/feature-guides/current-branch.mp4 docs/feature-guides/new-branch.gif docs/feature-guides/new-branch.mp4 docs/feature-guides/switch-branch.gif docs/feature-guides/switch-branch.mp4 docs/feature-guides/get-changes.gif docs/feature-guides/get-changes.mp4 docs/feature-guides/pull-request.gif docs/feature-guides/pull-request.mp4 docs/feature-guides/delete-branch.gif docs/feature-guides/delete-branch.mp4 docs/feature-guides/calm-typescript.gif docs/feature-guides/calm-typescript.mp4 docs/feature-guides/stability.gif docs/feature-guides/stability.mp4 docs/feature-guides/real-recordings.json
          git commit -m 'Add all eight verified actual IDE feature recordings'
          git push origin "HEAD:refs/heads/$MEDIA_BRANCH"
