name: Aster actual Antigravity appearance
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_screenshots:
        description: Commit two actual tested native PNGs to the existing repair branch
        type: boolean
        default: false
      expected_head:
        description: Exact current repair SHA; publication refuses any branch advancement
        type: string
        default: ''
  pull_request:
permissions:
  contents: read
jobs:
  actual-ide:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Fetch exact existing setup baseline for real migration regressions
        run: git fetch --depth=1 origin 31ee01f4fe6bcf75ff93cc56e6889a0cd9760009 f7a31811ca34e91ae04b4c29558323cce74ef156
      - name: Package and ownership regressions
        run: node --test tests/test-aster-appearance.mjs tests/test-personal-config-preservation.mjs tests/test-stability.mjs
      - name: Every tracked file inventory and JSON/JavaScript syntax
        run: node scripts/audit-tracked-files.cjs > tracked-file-audit.json
      - name: Every tracked PowerShell script syntax
        shell: powershell
        run: ./scripts/audit-powershell-syntax.ps1
      - name: Actual installer SHA-256 without optional PowerShell modules
        shell: powershell
        run: ./tests/test-aster-font-hash.ps1
      - name: Official Antigravity install and real rendered themes and panel
        shell: pwsh
        env:
          ASTER_VERIFY_FONT_INSTALL: '1'
        run: ./tests/test-windows-native-smoke.ps1 -AppearanceOnly
      - name: Actual host evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aster-antigravity-windows
          path: ${{ runner.temp }}/workstation-native-smoke-artifacts
          if-no-files-found: warn
      - name: Complete tracked-file inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-tracked-file-inventory
          path: tracked-file-audit.json
          if-no-files-found: warn
  publish-reviewed-capture:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_screenshots && github.ref == 'refs/heads/codex/repair-media-acceptance-20261026' && inputs.expected_head == github.sha
    needs: actual-ide
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v5
        with:
          name: aster-antigravity-windows
          path: ${{ runner.temp }}/aster-tested-native-capture
      - name: Validate provenance and publish only the two real PNGs
        env:
          ASTER_CAPTURE_ARTIFACT: ${{ runner.temp }}/aster-tested-native-capture
          ASTER_CAPTURE_EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: node tests/publish-aster-capture.cjs
