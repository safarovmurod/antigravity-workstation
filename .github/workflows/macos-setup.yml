name: macOS setup checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Standalone macOS installer checks
        run: |
          bash -n scripts/bootstrap-macos.sh
          node --check macos/setup.mjs
          node --test tests/test-macos-standalone.mjs
