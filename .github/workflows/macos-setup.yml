name: macOS setup checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.os }}
    # macOS /var is a symlink to /private/var; fixture safety guards correctly
    # reject linked ancestors. Keep temporary test fixtures on a real path.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Host architecture and shell preflight
        run: |
          uname -a
          test "$(uname -m)" = "${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}"
          bash -n scripts/bootstrap-macos.sh
          bash -n Install-Antigravity.command
          zsh -n scripts/bootstrap-macos.sh
          node --check macos/setup.mjs
      - name: macOS installer preservation and rollback regressions
        env:
          TMPDIR: ${{ runner.temp }}/
        run: node --test tests/test-macos-standalone.mjs
      - name: "Bootstrap entry smoke: real main clone, clear failure while the IDE is absent"
        env:
          TMPDIR: ${{ runner.temp }}/
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/bootstrap-smoke"
          cd "$RUNNER_TEMP/bootstrap-smoke"
          if bash "$GITHUB_WORKSPACE/scripts/bootstrap-macos.sh" > smoke.log 2>&1; then
            echo 'bootstrap must fail while Antigravity is not installed'; cat smoke.log; exit 1
          fi
          grep -q "Antigravity IDE was not found" smoke.log || { cat smoke.log; exit 1; }
          echo 'bootstrap cloned main from GitHub and failed cleanly at the missing IDE'
      - name: Full portable regression suite
        env:
          TMPDIR: ${{ runner.temp }}/
        run: npm test
