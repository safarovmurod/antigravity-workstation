name: Native Windows IDE smoke

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'lib/**'
      - 'bin/**'
      - 'config/**'
      - 'extensions/**'
      - 'scripts/**'
      - 'resources/**'
      - 'rules/**'
      - 'agents/**'
      - 'skills/**'
      - 'tests/test-agent-automation-native.mjs'
      - 'tests/test-native-compatibility.mjs'
      - 'tests/test-installer-preflight.mjs'
      - 'tests/test-rollback.mjs'
      - 'tests/test-setup-status.mjs'
      - 'tests/test-audit-regressions.mjs'
      - 'tests/test-quiet-completion.mjs'
      - 'tests/run-recovery-guards.cjs'
      - 'tests/test-windows-native-smoke.ps1'
      - 'tests/windows-native-smoke/**'
      - 'tests/extension-settings-host.cjs'
      - 'tests/editor-tooling-host.cjs'
      - 'tests/test-github-panel*.mjs'
      - 'tests/ide-profile/fixture/**'
      - '.github/workflows/native-windows-smoke.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'lib/**'
      - 'bin/**'
      - 'config/**'
      - 'extensions/**'
      - 'scripts/**'
      - 'resources/**'
      - 'rules/**'
      - 'agents/**'
      - 'skills/**'
      - 'tests/test-agent-automation-native.mjs'
      - 'tests/test-native-compatibility.mjs'
      - 'tests/test-installer-preflight.mjs'
      - 'tests/test-rollback.mjs'
      - 'tests/test-setup-status.mjs'
      - 'tests/test-audit-regressions.mjs'
      - 'tests/test-quiet-completion.mjs'
      - 'tests/run-recovery-guards.cjs'
      - 'tests/test-windows-native-smoke.ps1'
      - 'tests/windows-native-smoke/**'
      - 'tests/extension-settings-host.cjs'
      - 'tests/editor-tooling-host.cjs'
      - 'tests/test-github-panel*.mjs'
      - 'tests/ide-profile/fixture/**'
      - '.github/workflows/native-windows-smoke.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Smoke orchestration guards
        run: node --test tests/windows-native-smoke/test-controller.mjs tests/windows-native-smoke/test-full-catalog.mjs
      - name: Install official pinned IDE and test real open, shutdown and reopen
        shell: pwsh
        run: ./tests/test-windows-native-smoke.ps1
      - name: Upload real IDE report and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/workstation-native-smoke-artifacts
          if-no-files-found: warn
          retention-days: 7
